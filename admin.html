<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - Mas Gondrong</title>
  <style>
    body { font-family: Arial, sans-serif; background-color: #f0f2f5; margin: 0; padding: 20px; }
    .container { max-width: 500px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
    h2 { text-align: center; color: #0052cc; }
    input, textarea { width: 100%; padding: 10px; margin: 8px 0; box-sizing: border-box; border: 1px solid #ccc; border-radius: 5px; }
    button { padding: 10px; background: #0052cc; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; width: 100%; margin-top: 5px;}
    button:hover { background: #0040a0; }
    .info { text-align: center; font-size: 14px; color: #666; margin-bottom: 20px; }
    .product-list { margin-top: 20px; border-top: 1px solid #eee; padding-top: 20px; }
    .product-item { background: #f9f9f9; padding: 10px; margin-bottom: 10px; border-radius: 5px; display: flex; justify-content: space-between; align-items: center; }
    .btn-delete { background: #e74c3c; width: auto; padding: 5px 10px; font-size: 12px; margin: 0;}
    .btn-logout { background: #666; margin-top: 20px; }
  </style>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, query, onSnapshot, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // === PASTE KONFIGURASI FIREBASE KAMU DI SINI ===
    const firebaseConfig = {
  apiKey: "AIzaSyCtzYShY70eQGLNUnoQCi91uy7aMuFsYsc",
  authDomain: "mas-gondrong.firebaseapp.com",
  projectId: "mas-gondrong",
  storageBucket: "mas-gondrong.firebasestorage.app",
  messagingSenderId: "191854522046",
  appId: "1:191854522046:web:61bed6d89182392044b8ef"
};

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // FUNGSI LOGIN
    window.loginAdmin = function() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      signInWithEmailAndPassword(auth, email, password)
        .catch((error) => alert("Login Gagal! Periksa email/password."));
    }

    // FUNGSI LOGOUT
    window.logoutAdmin = function() { signOut(auth); }
    
           // FUNGSI TAMBAH PRODUK 
           window.tambahProduk = function() {
      const nama = document.getElementById('p-nama').value;
      const harga = document.getElementById('p-harga').value;
      const hargaCoret = document.getElementById('p-hargaCoret').value;
      const rating = document.getElementById('p-rating').value;
      const terjual = document.getElementById('p-terjual').value;
      const stok = document.getElementById('p-stok').value;
      const cod = document.getElementById('p-cod').checked; // true/false
      const gambarRaw = document.getElementById('p-gambar').value;
      const wa = document.getElementById('p-wa').value;
      const desc = document.getElementById('p-desc').value;

      if(!nama || !harga || !gambarRaw || !wa) {
        alert("Kolom wajib diisi!");
        return;
      }

      const gambarArray = gambarRaw.split(' ').filter(link => link.trim() !== '');

      addDoc(collection(db, "products"), {
        nama: nama,
        harga: harga,
        hargaCoret: hargaCoret,
        rating: rating,
        terjual: terjual,
        stok: stok,
        cod: cod,
        gambar: gambarArray, 
        wa: wa,
        desc: desc,
        createdAt: new Date()
      }).then(() => {
        alert("Produk berhasil ditambahkan!");
        document.getElementById('p-nama').value = '';
        document.getElementById('p-harga').value = '';
        document.getElementById('p-hargaCoret').value = '';
        document.getElementById('p-rating').value = '';
        document.getElementById('p-terjual').value = '';
        document.getElementById('p-stok').value = '';
        document.getElementById('p-cod').checked = false;
        document.getElementById('p-gambar').value = '';
        document.getElementById('p-wa').value = '';
        document.getElementById('p-desc').value = '';
      }).catch((error) => {
        alert("Gagal menambah produk: " + error);
      });
        }

    // FUNGSI HAPUS PRODUK
    window.hapusProduk = function(id) {
      if(confirm("Yakin mau hapus produk ini?")) {
        deleteDoc(doc(db, "products", id));
      }
    }

    // CEK STATUS LOGIN & TAMPILKAN PRODUK
    onAuthStateChanged(auth, (user) => {
      if (user) {
        document.getElementById('login-form').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';
        document.getElementById('user-email').innerText = user.email;

        // TAMPILKAN DAFTAR PRODUK REAL-TIME
        const q = query(collection(db, "products"));
        onSnapshot(q, (snapshot) => {
          const listDiv = document.getElementById('product-list');
          listDiv.innerHTML = '<h3>Daftar Produk Saat Ini</h3>';
          if(snapshot.empty) {
            listDiv.innerHTML += '<p>Belum ada produk.</p>';
          } else {
            snapshot.forEach((doc) => {
              const p = doc.data();
              listDiv.innerHTML += `
                <div class="product-item">
                  <div>
                    <strong>${p.nama}</strong> (${p.harga})<br>
                    <small>${p.gambar}</small>
                  </div>
                  <button class="btn-delete" onclick="hapusProduk('${doc.id}')">Hapus</button>
                </div>
              `;
            });
          }
        });

      } else {
        document.getElementById('login-form').style.display = 'block';
        document.getElementById('dashboard').style.display = 'none';
      }
    });
  </script>
</head>
<body>

  <!-- FORM LOGIN -->
  <div class="container" id="login-form">
    <h2>Login Admin Mas Gondrong</h2>
    <input type="email" id="email" placeholder="Email Admin" required>
    <input type="password" id="password" placeholder="Password" required>
    <button onclick="loginAdmin()">Login</button>
  </div>

<!-- DASHBOARD ADMIN -->
<div class="container" id="dashboard" style="display:none;">
  <h2>Dashboard Admin</h2>
  <p class="info">Login sebagai: <strong id="user-email"></strong></p>
  
  <h3>Tambah Produk Baru</h3>
  
  <!-- 1. INFO DASAR -->
  <input type="text" id="p-nama" placeholder="Nama Produk (cth: Kaos Ipin)">
  
  <!-- 2. HARGA & STATISTIK -->
  <input type="text" id="p-harga" placeholder="Harga Normal (cth: Rp100.000)">
  <input type="text" id="p-hargaCoret" placeholder="Harga Coret (opsional, cth: Rp150.000)">
  <input type="text" id="p-rating" placeholder="Rating Bintang (cth: 4.9)">
  <input type="text" id="p-terjual" placeholder="Jumlah Terjual (cth: 100)">
  <input type="text" id="p-stok" placeholder="Jumlah Stok (cth: 50)">
  
  <!-- 3. OPSI COD -->
  <label style="display:flex; align-items:center; gap:8px; margin:8px 0; font-size:14px;">
    <input type="checkbox" id="p-cod" style="width:auto;"> Tersedia COD (Bayar di Tempat)
  </label>
  
  <!-- 4. MEDIA & KONTAK -->
  <input type="text" id="p-gambar" placeholder="Link Foto (Pisahkan dengan SPASI jika lebih dari 1)">
  <input type="text" id="p-wa" placeholder="Link WhatsApp (cth: https://wa.me/...)">
  
  <!-- 5. DESKRIPSI -->
  <textarea id="p-desc" placeholder="Deskripsi Produk (Bahan, Ukuran, Warna, dll)" rows="4" style="width:100%; padding:10px; margin:8px 0; box-sizing:border-box; border:1px solid #ccc; border-radius:5px;"></textarea>
  
  <!-- TOMBOL SUBMIT -->
  <button onclick="tambahProduk()">+ Tambah Produk</button>

  <div class="product-list" id="product-list">
    <!-- Daftar produk akan muncul di sini -->
  </div>

  <button class="btn-logout" onclick="logoutAdmin()">Logout</button>
</div>

</body>
</html>
